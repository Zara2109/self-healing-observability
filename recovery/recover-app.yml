
---
- name: Recover the Node.js application
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check the target application container exists
      community.docker.docker_container_info:
        name: self-healing-observability-app-1
      register: app_info

    - name: Stop if the target container is missing
      ansible.builtin.fail:
        msg: "Target app container was not found. No recovery attempted."
      when: not app_info.exists

    - name: Restart the application container
      community.docker.docker_container:
        name: self-healing-observability-app-1
        state: started
        restart: true
      when: app_info.exists

    - name: Wait for the application health endpoint
      ansible.builtin.uri:
        url: http://host.docker.internal:8080/health
        method: GET
        status_code: 200
        return_content: true
      register: health_check
      retries: 5
      delay: 5
      until: health_check.status == 200
      when: app_info.exists
