
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "nodejs-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
