
groups:
  - name: application-alerts
    rules:
      - alert: ApplicationDown
        expr: up{job="nodejs-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Node.js application is down"
          description: "Prometheus cannot scrape the Node.js application."

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="nodejs-app",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="nodejs-app"}[5m])), 0.001)
          ) > 0.05
          and
          sum(rate(http_requests_total{job="nodejs-app"}[5m])) > 0.01
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of application requests are returning HTTP 5xx errors."
